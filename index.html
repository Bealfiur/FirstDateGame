<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nazlı ve Berkan'ın Kafesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Layout: tek sütun; üstte piksel kafe sahnesi, altında sırayla çizilen karakalem defteri */
:root{
  color-scheme:light;
  --bg:#E6F0ED;
  --panel:#F6FBF9;
  --fg:#1B2A28;
  --muted:#52706A;
  --line:#B9CFC9;
  --accent:#B8324A;
  --accent-ink:#FFFFFF;
  --gold:#E8B923;
  --paper:#FBF8F1;
  --f-display:"Pixelify Sans","Courier New",monospace;
  --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#142020;
    --panel:#1D2C2B;
    --fg:#E3EFEC;
    --muted:#93B2AB;
    --line:#35504B;
    --accent:#F2748B;
    --accent-ink:#2A0E15;
    --gold:#F0C54A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#142020;
  --panel:#1D2C2B;
  --fg:#E3EFEC;
  --muted:#93B2AB;
  --line:#35504B;
  --accent:#F2748B;
  --accent-ink:#2A0E15;
  --gold:#F0C54A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font-family:var(--f-body);
  font-size:16px;
  line-height:1.55;
  padding-block:28px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header h1{
  font-family:var(--f-display);
  font-weight:700;
  font-size:clamp(1.7rem,6vw,2.5rem);
  line-height:1.1;
  margin:0 0 6px;
  text-wrap:balance;
  letter-spacing:0.01em;
}
header p{margin:0;color:var(--muted);max-width:56ch}
.stage canvas{
  width:100%;
  aspect-ratio:190/100;
  display:block;
  image-rendering:pixelated;
  border:3px solid var(--fg);
  box-shadow:5px 5px 0 var(--line);
  background:#CFE3DF;
  cursor:default;
}
.stage .tip{margin:10px 0 0;font-size:14px;color:var(--muted)}
.game{
  background:var(--panel);
  border:2px solid var(--line);
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.topic{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topic .txt{flex:1;min-width:0}
.eyebrow{font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin:0}
.topic h2{font-family:var(--f-display);font-weight:500;font-size:1.3rem;margin:2px 0 0;line-height:1.25}
button{
  font:inherit;
  font-size:14px;
  font-weight:500;
  color:var(--fg);
  background:var(--panel);
  border:2px solid var(--fg);
  border-radius:3px;
  padding:8px 12px;
  box-shadow:0 3px 0 var(--fg);
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:40px;
}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--fg)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--fg)}
.turn{display:flex;align-items:center;gap:10px}
.dot{width:14px;height:14px;background:#6B6B72;border:2px solid var(--fg);flex:none}
#status{font-family:var(--f-display);font-weight:500;font-size:1.05rem;flex:none}
.meter{flex:1;height:10px;background:var(--bg);border:2px solid var(--line);min-width:40px}
.meter div{height:100%;width:100%;background:var(--accent)}
#round{font-size:13px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
#cv{
  width:100%;
  height:clamp(260px,56vw,400px);
  display:block;
  touch-action:none;
  background:var(--paper);
  border:2px solid var(--fg);
  cursor:crosshair;
}
.tools{display:flex;flex-wrap:wrap;gap:10px}
#hint{margin:0;font-size:14px;color:var(--muted);min-height:1.5em}
footer{font-size:13px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: reduce){button:active{transform:none}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Nazlı ve Berkan'ın Kafesi</h1>
    <p>İlk date'in masasına oturun. Defteri açın, kahvenizi alın ve sırayla karakalem çizin.</p>
  </header>

  <section class="stage" aria-label="Kafe sahnesi">
    <canvas id="sc" width="190" height="100" role="img" aria-label="Piksel sanat kafe: Nazlı ve Berkan yan yana iki yuvarlak masada karşılıklı oturmuş, defterlerine çizim yapıyor. Nazlı ice latte, Berkan ice americano içiyor."></canvas>
    <p class="tip">Bardaklara dokunun, yudum alsınlar.</p>
  </section>

  <section class="game" aria-label="Çizim oyunu">
    <div class="topic">
      <div class="txt">
        <p class="eyebrow">Konu</p>
        <h2 id="prompt"></h2>
      </div>
      <button id="newTopic" type="button">Yeni konu</button>
    </div>

    <div class="turn">
      <span id="dot" class="dot"></span>
      <span id="status">Sıra: Nazlı</span>
      <div class="meter" aria-hidden="true"><div id="bar"></div></div>
      <span id="round">Tur 1/8</span>
    </div>

    <canvas id="cv" aria-label="Ortak çizim defteri"></canvas>

    <div class="tools">
      <button id="toolP" type="button" aria-pressed="true">Kalem</button>
      <button id="toolE" type="button" aria-pressed="false">Silgi</button>
      <button id="skip" type="button">Sırayı geç</button>
      <button id="clr" type="button">Temizle</button>
    </div>
    <p id="hint" role="status">Çizmeye başlayınca süre işler. Her turda 20 saniyeniz var.</p>
  </section>

  <footer>Ice latte ve ice americano eşliğinde, iki kalem tek defter.</footer>
</div>
